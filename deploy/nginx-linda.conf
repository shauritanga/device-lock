# Linda production nginx — /etc/nginx/sites-available/linda
#
# Four hosts, one origin each. Replaces the old IP:8081 site entirely; there is
# no cleartext or IP-based entry point any more.
#
#   linda.co.tz         marketing site (static)
#   api.linda.co.tz     NestJS API           -> 127.0.0.1:3200
#   client.linda.co.tz  seller console SPA
#   admin.linda.co.tz   platform admin SPA
#
# certbot --nginx rewrites these blocks to add the :443 listeners and cert
# paths, and installs the :80 -> :443 redirects. Install this file first, run
# certbot, then reload.

upstream linda_api {
    server 127.0.0.1:3200;
    keepalive 8;
}

# ---------------------------------------------------------------- marketing --
server {
    listen 80;
    listen [::]:80;
    server_name linda.co.tz www.linda.co.tz;

    root /var/www/device-lock/website;
    index index.html;

    access_log /var/log/nginx/linda-site-access.log;
    error_log  /var/log/nginx/linda-site-error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static marketing assets change rarely.
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# --------------------------------------------------------------------- API --
server {
    listen 80;
    listen [::]:80;
    server_name api.linda.co.tz;

    client_max_body_size 20m;

    access_log /var/log/nginx/linda-api-access.log;
    error_log  /var/log/nginx/linda-api-error.log;

    location / {
        proxy_pass http://linda_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------- seller console --
server {
    listen 80;
    listen [::]:80;
    server_name client.linda.co.tz;

    root /var/www/device-lock/dashboard/dist/client;
    index index.html;

    access_log /var/log/nginx/linda-client-access.log;
    error_log  /var/log/nginx/linda-client-error.log;

    # Vite emits content-hashed filenames, so assets are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users get stranded on a stale build.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ----------------------------------------------------------- admin console --
server {
    listen 80;
    listen [::]:80;
    server_name admin.linda.co.tz;

    root /var/www/device-lock/dashboard/dist/admin;
    index index.html;

    access_log /var/log/nginx/linda-admin-access.log;
    error_log  /var/log/nginx/linda-admin-error.log;

    # Keep the admin console out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
